# 峡谷情报站 · 自动采集与内容同步
# 每 6 小时抓取官方/资讯源 → 生成 content/news_feed.json → 自动提交推送 → jsDelivr 管道更新
# App 端「检查在线更新」即可拉取最新内容（无需重新发版）。

name: Crawl & Sync

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时（UTC 0/6/12/18 点）
  workflow_dispatch:         # 也可手动触发

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run crawlers
        run: |
          node crawler/crawl.js
          node crawler/crawl_builds.js

      - name: Show result
        run: |
          node -e "const f=require('./content/news_feed.json');console.log('news items:',f.length);console.log(f.slice(0,5).map(i=>i.title).join('\n'))"
          node -e "const f=require('./content/champion_builds.json');console.log('champion builds:',f.length)"

      - name: Commit & push if changed
        run: |
          git config user.name "crawl-bot"
          git config user.email "crawl-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no content change, skip commit"
          else
            git commit -m "auto: crawl news feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
